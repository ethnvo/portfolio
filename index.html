<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/vite.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8EE0F0">
    <title>Ethan Vo's Portfolio</title>
    <link rel="preload" href="/fonts/AlloLatin.woff2" as="font" type="font/woff2" crossorigin>
    <script>
      // Pick the theme before the first paint: a saved choice wins, otherwise follow the device.
      // src/theme.ts applies the same rule once the app is running.
      (function () {
        var saved = null;
        try { saved = localStorage.getItem("theme"); } catch (e) {}
        var dark = saved === "dark" ||
          (saved !== "light" && !!window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var bar = document.querySelector('meta[name="theme-color"]');
        if (bar) bar.setAttribute("content", dark ? "#080B09" : "#8EE0F0");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
